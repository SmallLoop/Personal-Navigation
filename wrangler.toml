name = "personal-nav"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[vars]
# 添加你的域名到可信来源列表，多个用逗号分隔
# TRUSTED_ORIGINS = "https://nav.yourdomain.com"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "personal-nav-db"
database_id = "4d76a7d1-6502-48ef-a4ac-2e42c34765ee"
migrations_dir = "migrations"